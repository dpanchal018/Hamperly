name: Live Site Bug Crawler

on:
  schedule:
    # Runs at 02:00 UTC every day
    - cron: '0 2 * * *'
  workflow_dispatch: # Allows manual trigger from GitHub UI

jobs:
  run-live-crawler:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps chromium

      - name: Run Live Site Bug Crawler
        run: npm run test:live
        continue-on-error: true  # Always generate report even if tests fail

      - name: Generate QA Report Document
        if: always()
        run: node scripts/generate-qa-report.js

      - name: Upload QA Report & Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-crawler-report-${{ github.run_number }}
          path: |
            validation-reports/live-site/qa-report.md
            validation-reports/live-site/html/
            validation-reports/live-site/results.json
          retention-days: 30

      - name: Fail job if tests failed
        if: always()
        run: |
          STATUS=$(node -e "
            const d = require('./validation-reports/live-site/results.json');
            process.exit((d.stats?.unexpected ?? 0) > 0 ? 1 : 0);
          ")
